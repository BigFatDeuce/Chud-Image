[package]
name = "chud-image"
version = "1.2.0"
description = "Chud Image — a modern successor to Windows Photo Viewer"
authors = ["BigFatDeuce"]
license = "MIT"
repository = "https://github.com/BigFatDeuce/Chud-Image"
edition = "2021"
rust-version = "1.80"

[lib]
name = "chud_image_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "tga", "pnm", "qoi", "rayon"] }
kamadak-exif = "0.6"
imagesize = "0.15"
trash = "5"
percent-encoding = "2"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
# ONNX Runtime for the optional background removal, statically linked on Windows.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-31"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Graphics_Imaging",
] }

[target.'cfg(not(windows))'.dependencies]
# On Linux the prebuilt static ONNX Runtime needs a very recent glibc, so the library is
# loaded at runtime instead: Microsoft's official build, downloaded with the model.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libheif-rs = { version = "2", optional = true }

[features]
default = []
# HEIC/HEIF decoding on Linux through the system libheif (dnf install libheif-devel).
heif = ["dep:libheif-rs"]

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
# Image decoders are painfully slow without optimisations, even during development.
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
